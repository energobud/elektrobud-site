<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>Сторінку не знайдено — ЕЛЕКТРОБУД</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#101827">

    <!--
        GitHub Pages показує цю сторінку для будь-якої неіснуючої адреси,
        тому шляхи до файлів — абсолютні (/elektrobud-site/...).
    -->
    <link rel="icon" href="/elektrobud-site/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/elektrobud-site/style.css">
</head>

<body>

    <header>
        <h1><span aria-hidden="true">⚡</span> ЕЛЕКТРОБУД</h1>
        <p>Електрик та будівельні роботи в Миколаєві</p>
    </header>

    <main>

        <section class="hero">

            <h2>Сторінку не знайдено</h2>

            <p>
                Можливо, посилання застаріло або в адресі помилка.
                Перейдіть на головну сторінку або зв'яжіться з нами напряму.
            </p>

            <div class="buttons">

                <a class="btn call js-phone" data-track="call-404">
                    <span aria-hidden="true">📞</span> Зателефонувати
                </a>

                <a class="btn telegram"
                href="https://t.me/nikoelectro"
                target="_blank"
                rel="noopener noreferrer"
                data-track="telegram-404">
                    Написати в Telegram
                </a>

            </div>

            <p>
                <a class="header-phone" href="/elektrobud-site/">← На головну</a>
            </p>

        </section>

    </main>

    <footer>
        © 2026 ЕЛЕКТРОБУД. Усі права захищені.
    </footer>

    <script src="/elektrobud-site/main.js" defer></script>

</body>

</html>
